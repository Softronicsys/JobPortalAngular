<ngx-spinner bdColor="rgba(51,51,51,0.8)"
             size="medium"
             color="#fff"
             type="ball-scale-multiple">
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>

<div class="container" style="width:100%; ">
  <div class="row">
    <br><br>
    <div class="col-sm-3">
      <div style=" margin-top:5px; float:right;">
        <!--<div [ngStyle]="{'background-image': 'url(' + CompanyIdService.CompanyLogoBase64 + ')'}" id="logoAdjstmnt"></div>-->
        <img id="logoAdjstmnt" [src]=getSantizeUrl(CompanyIdService.CompanyLogoBase64) alt="" />
      </div>
      <br><br>
    </div>
    <div class="col-sm-3"></div>
    <div class="col-sm-3"></div>
    <div class="col-sm-2">

    </div>
    <div class="col-sm-1"></div>
  </div>
</div>

<div class="fntFmly">
  <div class="container">
    <div class="container">

      <div class="row" style="margin-top: 15px;">
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
          <div class="col-xs-3">
          </div>
          <div class="col-xs-6">

          </div>
          <div class="col-xs-3">

          </div>
        </div>
        <div class="col-lg-4 col-md-4"></div>
      </div>
      
      <h2 [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="position:relative;font-size:30px;"><strong> Thank You<!--{{lblThankYou}}--> </strong></h2>
      <h3 [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="position:relative;margin-bottom:20px; font-size:25px;">{{ successMsg }}</h3>
      <label style="position:relative;font-size:16px; font-weight: 500; width: 345px;" class="BlackTxtClr"> {{ successMsg1 }}.</label><br><br />
      <label style="position:relative;font-size:16px; font-weight: 500; width: 345px;" class="BlackTxtClr"> {{ successMsg2 }} or <a role="button" (click)="ResendActivaionEmail()">click here</a> to regenerate. </label>
    </div>
  </div>


  <div class="modal fade transformPopup" id="myModalSingupErr" role="dialog" data-toggle="modal" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-xlg fade1">
      <div class="modal-content">
        <div class="modal-body">

          <div class="row" style=" margin-top: 5px !important; text-align:center !important;">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <p style="text-align: center;" [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" [innerHTML]="MsgRegEmail"></p>
            </div>
          </div>


          <div class="row" style=" margin-top: 5px !important;">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <div class="form-group" style="text-align: center;">
                <a class="btn btn-lg btnTextColor greenBackgroundClr SaveBtn1" data-dismiss="modal" [style.backgroundColor]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style=" color: white;"><span class="fa fa-check"></span> OK </a>
              </div>
            </div>
          </div>

        </div>
      </div>


    </div>
  </div>
  <img id="BackgroundImageAccountSuccess" src={{BackgroundImage}} />
</div>
