<style>
  button:hover {
    background-color: #00b2ff;
    color: white;

  }
  #BackgroundImageLogin {
    position: absolute;
    bottom: 0;
  }
  @media only screen and (max-width: 400px) {
    #BackgroundImageLogin {
      display: none;
    }
  }
  @media only screen and (max-height: 500px) {
    #BackgroundImageLogin {
      display: none;
    }
  }

</style>


<ngx-spinner bdColor="rgba(51,51,51,0.8)"
             size="medium"
             color="#fff"
             type="ball-scale-multiple">
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>

<div class="fntFmly" *ngIf="WrongUrl">

  <img id="BackgroundImageLogin" style="z-index:-999;" src={{BackgroundImage}} />
  <div class="container-fluid">


    <form>

      <div class="row Vacancy">
        <div class="col-lg-12">

          <div class="col-sm-4"></div>

          <div class="col-sm-4 text-center">

            <label class="text-center" style="font-size:15px; color:red;font-weight: 600;" *ngIf="showMessage"><!--You must be logged in to apply against any vacancies.-->{{MustSignedIn}}</label>
          </div>
          <div class="col-sm-4"></div>
        </div>
      </div>

      <div class="row" style="margin-top: 15px;">
        <div class="col-lg-4 col-md-4 col-sm-4">
        </div>
        <div class="col-lg-4 col-md-4 col-sm-4">
        </div>
        <div class="col-lg-4 col-md-4 col-sm-4">
          <label class="forValidation" *ngIf="isMandatoryfields == true" style="float:right !important"><span style="color:red;font-size:14px !important" class="forValidation">*</span>Please enter mandatory fields.  &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;</label>
          <label class="forValidation" *ngIf="DisconnectInternet == true" style="float: right !important"><span style="color:red;font-size:14px !important" class="forValidation">*</span>Please check your internet connection and try again.  &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;</label>
        </div>
        <!--<div class="col-lg-1">
        </div>-->
      </div>

      <div class="row">
        <div class="col-lg-12">

          <div class="col-sm-4"></div>

          <div class="col-sm-4 text-center">

            <label for="exampleInputEmail1" class="text-center" [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-size:20px"><!--LOGIN-->{{btnLogin}} </label>
          </div>
          <div class="col-sm-4"></div>
        </div>
      </div>


      <div class="row" style="margin-top:10px;">
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
          <div class="col-xs-1">
          </div>
          <div class="col-xs-10">
            <label for="exampleInputEmail1" class="fntWght" style="font-size:12px;margin-left: -6px">
              <span style="color:red;font-size:14px !important" class="forValidation">*</span><!--Email-->{{APEmail}}
            </label>
            <input type="email" [ngClass]="{'BorderColor':isMandatoryfields && Email == ''}" maxlength="50" class="form-control" id="exampleInputEmail1" name="Email" [(ngModel)]="Email" placeholder="" style="border-radius:0px;">

          </div>

          <div class="col-xs-1">

          </div>
        </div>
        <div class="col-lg-4 col-md-4"></div>
      </div>




      <div class="row" style="margin-top:10px;">
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
          <div class="col-xs-1">
          </div>
          <div class="col-xs-10">
            <label for="exampleInputEmail1" class="fntWght" style="font-size:12px; margin-left: -6px"><span style="color:red; font-size:14px !important;" class="forValidation">*</span><!--Password-->{{LblPassword}}</label>
            <input [ngClass]="{'BorderColor':isMandatoryfields && Password == ''}" maxlength="20" type="password" class="form-control" id="Password" name="Password" [(ngModel)]="Password" placeholder="" style="border-radius:0px;">

          </div>

          <div class="col-xs-1">

          </div>
        </div>
        <div class="col-lg-4 col-md-4"></div>
      </div>


      <div class="row">
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">

          <div class="col-xs-12" style="text-align: center">
            <label style="margin-top: 15px;   white-space: pre-line;" class="forValidation" *ngIf="correctEmail == true && isAccountActivated == true">{{ msg }}</label>
            <label style="margin-top: 15px;" class="forValidation" *ngIf="correctEmail == true && isAccountActivated == false">{{ msg }}  </label>
            <span style="margin-top:15px" class="forValidation" *ngIf="correctEmail == true && isAccountActivated == false"><br />Please <a role="button" (click)="ResendActivaionEmail()">click here</a> to generate Activation Email. </span>
          </div>


        </div>
        <div class="col-lg-4 col-md-4"></div>
      </div>


      <br />
      <div class="row" style="margin-top: 10px;">
        <div class="col-lg-12">

          <div class="col-md-4"></div>

          <div class="col-md-4">
            <div class="col-sm-3 "></div>
            <div class="col-sm-6 ">
              <div>
                <div style="text-align:center; display:none;">
                  <label class="switch mrgLft45">
                    <input type="checkbox" [ngModel]="staySigned" name="staySigned" (change)="toggleVisibility($event)">
                    <span class="slider round"></span>

                  </label>
                  <label style="font-size:12px; float: right; margin-right: 30px;" [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" class="fntWght mrgLft70"><!--Stay signed in-->{{lblStaySignedIn}}</label>
                </div>

              </div>
            </div>
            <div class="col-sm-3 "></div>

          </div>
          <div class="col-md-4"></div>
        </div>
      </div>
      <br />


      <div class="row" style="margin-top: 10px;">
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
          <div class="col-xs-1">
          </div>
          <div class="col-xs-10">
            <button style="height:32px;" (click)="btnPost1_Click();" [style.backgroundColor]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" class="btn btn-block app-btn signup-btn clrhover"><!--LOG IN-->{{btnLogin}}</button>

          </div>

          <div class="col-xs-1">

          </div>
        </div>
        <div class="col-lg-4 col-md-4"></div>
      </div>


      <div class="row">
        <div class="col-lg-12">

          <div class="col-sm-4"></div>

          <div class="col-sm-4 text-center" style="margin:15px 0px 0px 0px; font-size: 13px; color: #007FFF;">

            <a style="cursor:pointer" (click)=" ShowMessageRemove()"><!--Forgot Password?-->{{lblForgotPassword}}</a>
          </div>
          <div class="col-sm-4"></div>
        </div>
      </div>


      <div class="row">
        <div class="col-lg-12">

          <div class="col-sm-4"></div>
          <!--src="assets/images/Sign-In-Small---Default.png"-->

          <div class="col-sm-4 text-center" *ngIf="this._config.environment.ShowLoginWithLinkedIN == true">
            <!--style="margin:15px 0px 15px 0px;"-->
            <!--*ngIf="isHideLinkedIn"-->
            <br />
            <a (click)="getLinkedIn()">
              <img src="assets/images/Sign-in-Large---Default.png" style="cursor:pointer">
            </a>
            <!--<a onclick="getDetails()">linked in</a>-->
            <br />
          </div>
          <div class="col-sm-4"></div>
        </div>
      </div>

      <!--<p style="color:red" [innerHTML]="j"></p>-->
    </form>
  </div>

  <div class="modal fade transformPopup" id="myModalSingupErr" role="dialog" data-toggle="modal" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-xlg fade1">
      <div class="modal-content">
        <div class="modal-body">

          <div class="row" style=" margin-top: 5px !important; text-align:center !important;">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <p style="text-align: center;" [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" [innerHTML]="MsgRegEmail"></p>
            </div>
          </div>


          <div class="row" style=" margin-top: 5px !important;">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <div class="form-group" style="text-align: center;">
                <a class="btn btn-lg btnTextColor greenBackgroundClr SaveBtn1" data-dismiss="modal" [style.backgroundColor]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style=" color: white;"><span class="fa fa-check"></span> OK </a>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
<script>
  $(function () {
    $(".modal-backdrop").css("display", "none");
  })
</script>
