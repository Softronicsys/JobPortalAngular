<ngx-spinner bdColor="rgba(51,51,51,0.8)"
             size="medium"
             color="#fff"
             type="ball-scale-multiple">
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>

<main *ngIf="activationError" class="container" style="padding-top: 24px;">
  <div class="alert alert-danger" role="alert">{{ activationError }}</div>
</main>
