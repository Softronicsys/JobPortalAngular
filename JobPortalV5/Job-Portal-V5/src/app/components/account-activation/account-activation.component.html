<ngx-spinner bdColor="rgba(51,51,51,0.8)"
             size="medium"
             color="#fff"
             type="ball-scale-multiple">
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>

<div *ngIf="RegType !== '2'" style="height: 745px;" [ngStyle]="{'background' : 'url('+BackgroundImage+') bottom'}">
<div class="container" style="width:100%;" *ngIf="WrongUrl">
  <div class="row">
    <br><br>
    <div class="col-sm-3">
      <div style=" margin-top:5px; float:right;" id="logoFloatRight">
        <!--<div [ngStyle]="{'background-image': 'url(' + CompanyIdService.CompanyLogoBase64 + ')'}" id="logoAdjstmnt"></div>-->
        <img id="logoAdjstmnt" [src]=getSantizeUrl(CompanyIdService.CompanyLogoBase64) alt="" />
      </div>
      <br><br>
    </div>
    <div class="col-sm-3"></div>
    <div class="col-sm-3"></div>
    <div class="col-sm-2">

    </div>
    <div class="col-sm-1"></div>
  </div>
</div>

  <div class="fntFmly">
    <div class="container" *ngIf="ViewProfile">
 <span *ngIf="!IsAssessmentScheduled">
   <label style="margin-top:12px;font-size: 27px;">
     <strong [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]"> Account Activation<!--{{lblAccountActivation}}--></strong>
   </label><br />
   <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 300 !important; font-size: 27px;"><!--Dear-->{{lblDear}} {{AccountData.UserName}} </label> <br />
        <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 400 !important; font-size: 18px;">{{ LinkMsg1 }}!</label> <br /><br />
        <label style="font-weight: 400 !important; font-size: 16px; color: black !important; width: 370px;">{{ LinkMsg2 }}.</label>
   <br />
   <br />
   <div class="form-group">
     <button (click)="PersonalInfo();" [style.backgroundColor]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" class="form-control btn btnTextColor clrhover" style="border-radius:20px 20px 20px 20px; letter-spacing: 0.5px; font-family: Barlow Medium !important; font-size: 11px; height: 27px;width:240px; background: #007FFF; color: white; padding: 0px; cursor: pointer;">MY PROFILE<!--{{lblViewProfile}}--></button>
   </div>    
 </span>
      <!--For Assessment Work-->
      <span *ngIf="IsAssessmentScheduled">
        <label style="margin-top:12px;font-size: 27px;">
          <strong [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]"> Account Activation Successful!<!--{{lblAccountActivation}}--></strong>
        </label><br />
        <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 300 !important; font-size: 25px; margin-bottom: -1px;"><!--Dear-->Thank you <!--{{lblDear}}-->{{AccountData.UserName}} </label> <br />
        <label style="font-weight: 400 !important; font-size: 13px; color: black !important; margin-top: 13px;">You have been scheduled for the following Assessments:</label><br />
        <label  [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 600 !important; font-size: 12px; color: black !important; width: 370px;">{{AssessmentNames1}} </label><br />
        <label  [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 600 !important; font-size: 12px; color: black !important; width: 370px;">{{AssessmentNames2}}</label><br />
        <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 600 !important; font-size: 12px; color: black !important; width: 370px;">{{AssessmentNames3}}</label><br />
        
        <div class="form-group" style=" margin-top: 6px;">
          <button (click)="PersonalInfo();" [style.backgroundColor]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" class="form-control btn btnTextColor clrhover" style="border-radius:20px 20px 20px 20px; letter-spacing: 0.5px; font-family: Barlow Medium !important; font-size: 11px; height: 27px;width:240px; background: #007FFF; color: white; padding: 0px; cursor: pointer;">MY PROFILE<!--{{lblViewProfile}}--></button>
        </div>
        <label style="font-weight: 400 !important; font-size: 12px; color: black !important; width: 370px; margin-top: -6px;">Kindly open your profile and click on the Assessments tab to complete each Assessment.</label>
      </span>
    </div>

    <div class="container" *ngIf="registered">
      <label style="font-size: 27px;margin-top:12px;">
        <strong [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]"> Account Activation<!--{{lblAccountActivation}}--></strong>
      </label><br />
      <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 300 !important; font-size: 27px;"><!--Dear-->{{lblDear}} {{AccountData.UserName}} </label> <br />
      <label  style="font-weight: 400 !important; font-size: 18px;">{{ AccountData.Message }}</label>
      &nbsp;<label  style="font-weight: 400 !important; font-size:18px">{{ NameCompany }}</label>
      <br /><br />
      <div class="form-group">
        <button (click)="login();" [style.backgroundColor]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" class="form-control btn btnTextColor clrhover" style="border-radius:20px 20px 20px 20px; letter-spacing: 0.5px; font-family: Barlow Medium !important; font-size: 11px; height: 27px;width:240px; background: #007FFF; color: white; padding: 0px; cursor: pointer;"><!--LOGIN-->{{lbllogin}}</button>
      </div>
    </div>


    <div class="container" *ngIf="wrong">
      <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="margin-top:12px;font-size: 27px;">
        <strong> Account Activation</strong>
      </label>
      <br />

      <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 400 !important; font-size: 18px;">Activation link is either expired or invalid.</label>
      <br /><br /><br />  <br /> <br />
    </div>
  



    <div class="container" *ngIf="regenerateLink">
      <label style="margin-top:12px;font-size: 27px;">
        <strong [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]"> Account Activation<!--{{lblAccountActivation}}--></strong>
      </label><br />
      <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 400 !important; font-size: 16px;">{{ LinkMsg1 }}</label> <br /><br />
      <label [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-weight: 400 !important; font-size: 16px;">{{ NameCompany }}</label>
      <br /><br />
      <div class="form-group">
        <button (click)="GenerateLink();" [style.backgroundColor]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" *ngIf="Linkbutton" data-toggle="modal" data-target="#myModal" class="form-control btn btnTextColor clrhover" style="border-radius:20px 20px 20px 20px; letter-spacing: 0.5px; font-family: Barlow Medium !important; font-size: 11px; height: 27px;width:240px; background: #007FFF; color: white; padding: 0px; "><!--GENERATE NEW LINK-->{{lblGenerateNewLink}}</button>
      </div>
    </div>
