<style>
  button:hover {
    background-color: #00b2ff;
    color: white;
  }
</style>


<!--Page Load Spinner Open-->
<ngx-spinner
             bdColor="rgba(51,51,51,0.8)"
             size="medium"
             color="#fff"
             type="ball-scale-multiple">
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>

<!--Page Load Spinner Close-->

<div  class="fntFmly" *ngIf="WrongUrl">
  <div class="container-fluid">


    <form>

      <div class="row" style="margin-top: 50px;">
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">

        </div>
        <div class="col-lg-4 col-md-4">
          <label id="validationss" style="color:red;" class="mandatoryStar" *ngIf="DisconnectInternet == true">&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:red;font-size:14px !important" class="forValidation">*</span> Please check your internet connection and try again.</label>
          <label id="validationss" style="color:red;" class="mandatoryStar" *ngIf="isMandatoryfields == true">&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:red;font-size:14px !important" class="forValidation">*</span> Please enter mandatory fields.</label>
          
        </div>
      </div>




      <div class="row" style="margin-top: 25px;">
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
          <div class="col-xs-1"></div>
            <div class="col-xs-10">
              <label for="exampleInputEmail1" class="text-center" [style.color]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" style="font-size:16px; margin-bottom: 0px !important;"><!--Please Enter Your Email Address-->{{lblPleaseEnterYourEmailAddress}} </label>

            </div>
          <div class="col-xs-1"></div>

          </div>
        <div class="col-lg-4 col-md-4"></div>
      </div>





      <div class="row">

        <div class="form-group col-lg-12 ">

        </div>

      </div>




      <div class="row" >
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
          <div class="col-xs-1"></div>
            <div class="col-xs-10">
              <input type="email" maxlength="50"  class="form-control" id="exampleInputEmail1" placeholder="" name="email" [(ngModel)]="Email"> <br />
              <div style=" text-align: center; margin-bottom: 10px;" *ngIf="iserrorMsg">
                <p style="color:red; font-weight: 600; font-size:14px !important" class="mandatoryStar">{{errorMsg}}</p>
              </div>
            </div>
          <div class="col-xs-1"></div>

          </div>
        <div class="col-lg-4 col-md-4"></div>
      </div>



      <div class="row" style="margin-bottom: 10px !important;" >
        <div class="col-lg-4 col-md-4"></div>
        <div class="col-lg-4 col-md-4 col-sm-12 col-xs-12">
          <div class="col-xs-3">
          </div>
          <div class="col-xs-6" style="text-align: -webkit-center !important;">
            <button  style="width:115px; height:25px; font-size:12px !important"  [style.backgroundColor]="[ThemeFontColor ? ThemeFontColor  : DefaultFontColor]" type="button" (click)="btnPost1_Click();" class="btn btn-block app-btn signup-btn clrhover"><!--Verify Email-->{{lblVerifyEmail}} </button>

          </div>
          <div class="col-xs-3">

          </div>
        </div>
        <div class="col-lg-4 col-md-4"></div>
      </div>

    </form>
  </div>
  <img id="BackgroundImageForgetpassword" src={{BackgroundImage}} />
</div>
